<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omunyin Digital Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Omunyin Digital Register</h1>
    <p class="byline">by Omunyin Shadrach</p>
    <p id="todayDate"></p>
  </header>

  <main>

    <!-- LOGIN SECTION -->
    <section class="card" id="authSection">
      <h2>Teacher Login</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password (at least 6 characters)">
      <div class="row">
        <button id="loginBtn" class="small">Log In</button>
        <button id="signupBtn" class="small">Sign Up</button>
      </div>
      <button id="resetBtn" class="linklike">Forgot password?</button>
    </section>

    <!-- REGISTER SECTION (hidden until login) -->
    <div id="appSection" style="display:none;">

      <section class="card">
        <div class="row">
          <span id="userEmail" style="flex:1; align-self:center;"></span>
          <button id="logoutBtn" class="small danger">Log Out</button>
        </div>
      </section>

      <section class="card">
        <h2>Class Details</h2>
        <input type="text" id="className" placeholder="Class name (e.g. Form 2 East)">
        <input type="date" id="registerDate">
        <p class="note" id="rosterNote"></p>
      </section>

      <section class="card">
        <h2>Add New Student</h2>
        <input type="text" id="studentName" placeholder="Student full name">
        <div class="row">
          <input type="text" id="admNo" placeholder="Admission number">
          <button id="addBtn">Add</button>
        </div>
      </section>

      <section class="card">
        <h2>Mark Attendance</h2>

        <div class="summary">
          <span>Total: <strong id="totalCount">0</strong></span>
          <span class="present-text">Present: <strong id="presentCount">0</strong></span>
          <span class="absent-text">Absent: <strong id="absentCount">0</strong></span>
        </div>

        <div class="row">
          <button id="allPresentBtn" class="small">Mark All Present</button>
          <button id="clearBtn" class="small danger">Reset Marks</button>
        </div>

        <div class="table-wrap">
          <table id="studentTable">
            <thead>
              <tr>
                <th>No.</th>
                <th>Student Name</th>
                <th>Adm No.</th>
                <th>P</th>
                <th>A</th>
                <th>X</th>
                <th>Del</th>
              </tr>
            </thead>
            <tbody id="studentList"></tbody>
          </table>
        </div>

        <button id="saveBtn" class="save">Save Today's Register</button>
      </section>

      <section class="card">
        <h2>Saved Registers</h2>
        <p class="note">Tap any saved day to open it.</p>
        <ul id="savedList"></ul>
        <button id="refreshSavedBtn" class="linklike">Refresh list</button>
      </section>

    </div>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
